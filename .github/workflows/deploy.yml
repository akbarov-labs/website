name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Build once, then deploy: every push to main becomes one image, which goes
# straight to production (no staging, the same as random-bot and posbon).
# promote.yml redeploys a chosen build by hand, which is the rollback button.
# The image build runs `astro build`, so a broken page or bad blog post
# front matter stops here, before anything is deployed.

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    needs: build
    uses: ./.github/workflows/deploy-to.yml
    permissions:
      packages: read
    with:
      environment: production
      image_tag: ${{ github.sha }}
    secrets: inherit
