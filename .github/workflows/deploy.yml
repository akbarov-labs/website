name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Build once, then deploy: every push to main becomes two images, web (the
# site) and assistant (the AI chat), tagged with the same commit, which go
# straight to production (no staging, the same as random-bot and posbon).
# promote.yml redeploys a chosen build by hand, which is the rollback button.
# The web build runs `astro build`, so a broken page or bad blog post front
# matter stops here, before anything is deployed; the assistant's type check
# stops a broken assistant the same way.

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Type-check the assistant
        working-directory: assistant
        run: |
          npm ci
          npm run check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}/web:latest
            ${{ env.IMAGE }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push the assistant image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: assistant/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}/assistant:latest
            ${{ env.IMAGE }}/assistant:${{ github.sha }}
          cache-from: type=gha,scope=assistant
          cache-to: type=gha,mode=max,scope=assistant

  deploy-production:
    needs: build
    uses: ./.github/workflows/deploy-to.yml
    permissions:
      packages: read
    with:
      environment: production
      image_tag: ${{ github.sha }}
    secrets: inherit
