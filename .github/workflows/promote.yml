name: Promote to production

# Deploys an already-built image to production by hand: Actions → "Promote
# to production" → Run workflow. Without staging, deploy.yml already puts
# every push on production, so this is the rollback button: give it an older
# commit's full SHA and that build goes back on.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Full commit SHA to promote. Leave empty for the latest commit on main."
        required: false
        type: string

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          tag=${INPUT_TAG:-$HEAD_SHA}
          # deploy.yml tags images with the full 40-character SHA.
          if ! [[ $tag =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::'$tag' is not a full commit SHA"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Promoting $tag to production" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    needs: resolve
    uses: ./.github/workflows/deploy-to.yml
    permissions:
      packages: read
    with:
      environment: production
      image_tag: ${{ needs.resolve.outputs.tag }}
    secrets: inherit
