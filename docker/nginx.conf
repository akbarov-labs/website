# Serves the built site. The server's edge Caddy terminates HTTPS and
# forwards plain HTTP here; Cloudflare sits in front of Caddy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Built assets have a content hash in their name, so they never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The AI assistant: the akbarovlabs-assistant container of the same compose project.
    # Its address is looked up per request, so nginx starts, and the site
    # works, even when the assistant is down; the chat then stays the sample.
    location /api/assistant/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $assistant http://akbarovlabs-assistant:8080;
        proxy_pass $assistant;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The edge Caddy puts the visitor's address first; nginx adds its own after it.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Replies stream word by word; don't hold them back.
        proxy_buffering off;
        proxy_read_timeout 120s;
        client_max_body_size 16k;
        # The assistant sets Cache-Control itself.
        add_header X-Content-Type-Options nosniff always;
    }

    # Pages: always check for a new version (cheap, thanks to ETag).
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
